<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Chamo Matriz - Acceso Central</title>
    <!-- Librería CryptoJS para la compatibilidad del sistema -->
    <script src="https://cloudflare.com"></script>
    <style>
        :root {
            --bg-color: #0d1117;
            --container-bg: #161b22;
            --accent-color: #238636;
            --accent-hover: #2ea043;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --border-color: #30363d;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
        }

        .login-container {
            background-color: var(--container-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 32px;
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
        }

        .formulario-vista {
            display: none;
        }

        .formulario-vista.active {
            display: block;
        }

        h2 {
            font-size: 24px;
            font-weight: 300;
            letter-spacing: -0.5px;
            margin-top: 0;
            margin-bottom: 20px;
            text-align: center;
        }

        .campo-grupo {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
        }

        input, select {
            width: 100%;
            padding: 8px 12px;
            font-size: 14px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-main);
            box-sizing: border-box;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #58a6ff;
            box-shadow: 0 0 0 3px rgba(56, 139, 253, 0.3);
        }

        button {
            width: 100%;
            padding: 12px;
            font-size: 14px;
            font-weight: 500;
            color: #ffffff;
            background-color: var(--accent-color);
            border: 1px solid rgba(240, 246, 252, 0.1);
            border-radius: 6px;
            cursor: pointer;
            margin-top: 15px;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        .enlace-footer {
            margin-top: 20px;
            text-align: center;
            font-size: 12px;
        }

        .enlace-footer a {
            color: #58a6ff;
            text-decoration: none;
            cursor: pointer;
        }

        .enlace-footer a:hover {
            text-decoration: underline;
        }

        .footer-sistema {
            text-align: center;
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 30px;
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
        }
    </style>
</head>
<body>

<div class="login-container">
    
    <!-- 1. VISTA: INICIO DE SESIÓN TRADICIONAL -->
    <div id="vistaLogin" class="formulario-vista active">
        <h2>ACCESO AL SISTEMA</h2>
        <div class="campo-grupo">
            <label for="usuarioInput">Nombre de Usuario</label>
            <input type="text" id="usuarioInput" placeholder="Ej: Juan">
        </div>
        <div class="campo-grupo">
            <label for="passwordInput">Contraseña Clave</label>
            <input type="password" id="passwordInput" placeholder="••••••••">
        </div>
        <button onclick="ejecutarLoginTransaccional()">ENTRAR</button>
        <div class="enlace-footer">
            <a onclick="irAVistaFormulario('registro')">Crear Usuario Administrador / Cajero</a>
        </div>
    </div>

    <!-- 2. VISTA: REGISTRO SEGURO AUTOMÁTICO -->
    <div id="vistaRegistro" class="formulario-vista">
        <h2>REGISTRO AUTOMÁTICO</h2>
        <div class="campo-grupo">
            <label for="pinInput">PIN de Seguridad Máster</label>
            <input type="password" id="pinInput" placeholder="Ingrese PIN Autorización">
        </div>
        <div class="campo-grupo">
            <label for="nuevoUsuarioInput">Asignar Nombre de Usuario</label>
            <input type="text" id="nuevoUsuarioInput" placeholder="Ej: Pedro_Abasto">
        </div>
        <div class="campo-grupo">
            <label for="nuevoPasswordInput">Definir Contraseña Clave</label>
            <input type="password" id="nuevoPasswordInput" placeholder="••••••••">
        </div>
        
        <div class="campo-grupo">
            <label for="rolSelect">Asignar Nivel de Acceso (Rol)</label>
            <select id="rolSelect">
                <option value="Cajero">🛒 Cajero / Vendedor (Acceso a Kiosco)</option>
                <option value="Inquilino">📊 Inquilino / Aliado (Matriz de su Negocio)</option>
                <option value="Propietario">👑 Propietario / Administrador Central (Tú)</option>
            </select>
        </div>

        <div class="campo-grupo">
            <label for="sucursalInput">ID Sucursal Asignada</label>
            <input type="text" id="sucursalInput" placeholder="Ej: MATRIZ, KIOSCO-01, ABASTO-02">
        </div>

        <button onclick="ejecutarRegistroNuevoUsuario()">VALIDAR Y REGISTRAR</button>
        <div class="enlace-footer">
            <a onclick="irAVistaFormulario('login')">Volver al Acceso</a>
        </div>
    </div>

    <div class="footer-sistema">
        PROYECTO EL CHAMO MATRIZ © 2026<br>
        Infraestructura Tecnológica de Alta Estabilidad
    </div>
</div>

<script>
    // URL CENTRAL: COLOCA AQUÍ LA URL DE TU CLON DE PRUEBAS /EXEC
    const API_URL = "https://script.google.com/macros/s/AKfycbxMHj2yFMAE3JumDFcwR6AUfgMtja-lgjTA71qQbihGpiCOIDMoidcBfLcGdaDZhTKa/exec";

    // 1. MOTOR PWA: ACTIVACIÓN DEL SERVICE WORKER (Para abrir la app sin internet)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('PWA: Motor de supervivencia activo.'))
          .catch(err => console.error('PWA: Falla en la inicialización básica', err));
      });
    }

    // Intercambio de vistas SPA corregido con classList nativo sin mezclas
    function irAVistaFormulario(vista) {
        document.getElementById("vistaLogin").classList.remove("active");
        document.getElementById("vistaRegistro").classList.remove("active");
        
        if (vista === 'login') {
            document.getElementById("vistaLogin").classList.add("active");
        }
        if (vista === 'registro') {
            document.getElementById("vistaRegistro").classList.add("active");
        }
    }

    // 2. INICIO DE SESIÓN CON LÓGICA DE SUPERVIVENCIA (LOCALSTORAGE OFFLINE)
    async function ejecutarLoginTransaccional() {
        var userEl = document.getElementById("usuarioInput").value.trim();
        var passEl = document.getElementById("passwordInput").value.trim();
        
        if (!userEl || !passEl) {
            alert("⚠️ Introduzca su usuario y contraseña.");
            return;
        }

        // MODO SIN INTERNET: Validamos con el respaldo guardado en la computadora
        if (!navigator.onLine) {
            var sesionLocal = localStorage.getItem("chamo_matriz_session");
            if (sesionLocal) {
                var datosLocales = JSON.parse(sesionLocal);
                if (userEl.toLowerCase() === datosLocales.usuario.toLowerCase() && passEl === datosLocales.password) {
                    alert("📡 MODO SUPERVIVENCIA ACTIVADO: Acceso local concedido sin conexión.");
                    redirigirSegunRol(datosLocales.rol);
                    return;
                }
            }
            alert("❌ ERROR: El equipo no tiene internet y no hay credenciales guardadas localmente.");
            return;
        }

        // MODO CON INTERNET: Petición oficial a tu Apps Script con la acción exacta
        var peticionCentral = {
            accion: "LOGIN_USUARIO",
            payload: { usuario: userEl, password: passEl, sucursal: "MATRIZ" }
        };
        
        try {
            var response = await fetch(API_URL, { method: "POST", body: JSON.stringify(peticionCentral) });
            var respuestaServidor = await response.json();
            
            if (respuestaServidor.estatus === "SUCCESS") {
                var autenticacion = respuestaServidor.data;
                
                if (autenticacion.autenticado === true) {
                    alert("✅ ¡ACCESO CONCEDIDO! Creando copia de respaldo en este equipo...");
                    
                    // Almacenar localmente en la PC para cuando se vaya la luz o el internet
                    var datosParaGuardar = {
                        usuario: userEl,
                        password: passEl,
                        rol: autenticacion.rol,
                        sucursalAsignada: autenticacion.sucursalAsignada
                    };
                    localStorage.setItem("chamo_matriz_session", JSON.stringify(datosParaGuardar));
                    
                    redirigirSegunRol(autenticacion.rol);
                } else {
                    alert("❌ ACCESO DENEGADO: " + autenticacion.mensaje);
                }
            } else {
                alert("⚠️ Error del motor: " + respuestaServidor.mensaje);
            }
        } catch (err) {
                    // Intento de rescate si el internet falló a mitad de la carga
            if (localStorage.getItem("chamo_matriz_session")) {
                var datos = JSON.parse(localStorage.getItem("chamo_matriz_session"));
                if (userEl.toLowerCase() === datos.usuario.toLowerCase() && passEl === datos.password) {
                    redirigirSegunRol(datos.rol);
                    return;
                }
            }
            alert("❌ Red inestable: No se pudo conectar con el servidor de Google Sheets.");
        }
    }

    // ENRUTADOR INTELIGENTE POR ROLES
    function redirigirSegunRol(rol) {
        if (rol === "Propietario") {
            window.location.href = "matrix.html";
        } else if (rol === "Inquilino") {
            window.location.href = "matrix_inquilino.html";
        } else {
            window.location.href = "kiosco.html";
        }
    }

    // 3. REGISTRO AUTOMÁTICO DE USUARIOS (Inyección directa a Google Sheets)
    async function ejecutarRegistroNuevoUsuario() {
        var pin = document.getElementById("pinInput").value.trim();
        var user = document.getElementById("nuevoUsuarioInput").value.trim();
        var pass = document.getElementById("nuevoPasswordInput").value.trim();
        var rolSeleccionado = document.getElementById("rolSelect").value;
        var sucursalAsignada = document.getElementById("sucursalInput").value.trim();
        
        if (pin !== "2026M") {
            alert("⚠️ PIN Máster incorrecto. Registro cancelado.");
            return;
        }
        
        if (!user || !pass || !sucursalAsignada) {
            alert("⚠️ Rellene todos los campos.");
            return;
        }
        
        var peticionCentral = {
            accion: "REGISTRAR_USUARIO",
            payload: {
                nuevoUsuario: user,
                nuevoPassword: pass,
                nuevoRol: rolSeleccionado,
                nuevaSucursal: sucursalAsignada
            }
        };
        
        try {
            var response = await fetch(API_URL, { method: "POST", body: JSON.stringify(peticionCentral) });
            var respuestaServidor = await response.json();
            
            if (respuestaServidor.estatus === "SUCCESS") {
                alert("🎉 ÉXITO: Usuario [" + user + "] inyectado automáticamente en Google Sheets con ID: " + respuestaServidor.data.idUsuario);
                irAVistaFormulario('login');
            } else {
                alert("❌ Error al inyectar el usuario en la hoja de cálculo.");
            }
        } catch (err) {
            alert("❌ Error crítico de comunicación: " + err.message);
        }
    }
</script>
</body>
</html>
